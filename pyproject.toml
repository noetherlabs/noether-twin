[project]
name = "noether-optics"
version = "0.1.0"
description = "Learned control + runtime assurance for adaptive optics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "hcipy>=0.5.1",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]
jax = [
    "jax>=0.4.28",
    "equinox>=0.11",
    "optax>=0.2",
    "dLux==0.15.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noether_optics"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "src/noether_optics/control/po4ao_repro",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = true
